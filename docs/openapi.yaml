openapi: "3.1.0"
info:
  title: EC Site API
  version: "1.0.0"

paths:
  /auth/signup:
    post:
      summary: 会員登録
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "201":
          description: 登録した会員
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
  /auth/login:
    post:
      summary: ログイン
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthInput"
      responses:
        "200":
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
  /auth/logout:
    post:
      summary: ログアウト
      operationId: logout
      responses:
        "204":
          description: ログアウト完了
  /auth/me:
    get:
      summary: 現在のログインユーザー取得
      operationId: getMe
      responses:
        "200":
          description: ログイン中の会員
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          description: 未認証

  /products:
    get:
      summary: 商品一覧取得
      operationId: getProducts
      responses:
        "200":
          description: 商品一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /admin/products:
    post:
      summary: 商品登録（管理者）
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductInput"
      responses:
        "201":
          description: 登録した商品
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: 未認証

  /cart/items:
    get:
      summary: カート取得
      operationId: getCartItems
      responses:
        "200":
          description: カート内の商品一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CartItem"
        "401":
          description: 未認証
    post:
      summary: カートに商品追加
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemInput"
      responses:
        "201":
          description: 追加したカートアイテム
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"
        "401":
          description: 未認証
        "404":
          description: 商品が存在しない
        "409":
          description: 在庫不足

  /cart/items/{id}:
    patch:
      summary: カートアイテムの数量変更
      operationId: updateCartItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemInput"
      responses:
        "200":
          description: 更新したカートアイテム
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"
        "401":
          description: 未認証
        "404":
          description: カートアイテムが存在しない
        "409":
          description: 在庫不足
    delete:
      summary: カートから商品削除
      operationId: removeCartItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 削除完了
        "401":
          description: 未認証
        "404":
          description: カートアイテムが存在しない

  /orders:
    post:
      summary: 注文確定
      description: カートの内容で注文を作成し、モック決済を実行する
      operationId: createOrder
      responses:
        "201":
          description: 作成した注文
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: 未認証
        "409":
          description: 在庫不足または空カート

components:
  schemas:
    AuthInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8

    Member:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string

    Product:
      type: object
      required:
        - id
        - name
        - price
        - stock
        - description
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: integer
        stock:
          type: integer
        description:
          type: string

    CreateProductInput:
      type: object
      required:
        - name
        - price
        - stock
        - description
      properties:
        name:
          type: string
          minLength: 1
        price:
          type: integer
          minimum: 1
        stock:
          type: integer
          minimum: 0
        description:
          type: string

    CartItem:
      type: object
      required:
        - id
        - productId
        - name
        - price
        - quantity
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: integer
        quantity:
          type: integer

    AddCartItemInput:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1

    UpdateCartItemInput:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1

    Order:
      type: object
      required:
        - id
        - items
        - totalPrice
      properties:
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        totalPrice:
          type: integer

    OrderItem:
      type: object
      required:
        - id
        - productId
        - name
        - unitPrice
        - quantity
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        name:
          type: string
        unitPrice:
          type: integer
        quantity:
          type: integer
